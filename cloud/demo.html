<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Archive Repository</title><style>body{margin:0;padding:40px;font:16px system-ui;background:#f2f3ee;color:#242622}h1{font-size:42px;font-weight:400}button{border:0;color:white;padding:12px 22px;font:inherit;cursor:pointer}.shape{width:100px;height:100px;margin:45px 0;transition:transform .7s;border-radius:3px}</style><script src="/cloud-config.js"></script><script src="/repository-adapter.js"></script></head><body><h1></h1><p role="status"></p><div class="shape" hidden></div><button type="button" hidden>재생</button><script>addEventListener('DOMContentLoaded',async()=>{try{const id=location.pathname.slice(6);history.replaceState(null,'','/r/'+encodeURIComponent(id)+location.search);const result=await ArchiveRepository.load(),record=result.records.find(item=>item.id===id);if(!record)throw Error('기록을 찾을 수 없습니다.');document.querySelector('h1').textContent=record.title.replace(/\n/g,' ');document.querySelector('p').textContent=record.summary;for(const node of document.querySelectorAll('.shape,button')){node.hidden=false;node.style.background=record.color;}document.querySelector('button').onclick=()=>{const shape=document.querySelector('.shape');shape.style.transform=shape.style.transform?'':'translateX(150px) rotate(135deg)';};}catch(error){document.querySelector('p').textContent=error.message;}});</script></body></html>
